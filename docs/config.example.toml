# An airut bot's configuration, showing every key config.Load reads.
#
# Secrets are never written here as plaintext. A key that holds one
# takes exactly one of:
#
#   { env = "NAME" }         an environment variable
#   { credential = "NAME" }  a systemd credential: $CREDENTIALS_DIRECTORY/NAME,
#                            from LoadCredential= or SetCredentialEncrypted=
#   { file = "PATH" }        a file; a relative path is relative to this file
#   { sealed = "enc:age:v2:..." }
#                            the value itself, sealed to an age recipient
#                            and bound to this key, opened with [secrets] key
#
# A file or credential has one line ending (LF or CRLF) trimmed. A
# plain string where a secret belongs is refused.
#
# Relative paths elsewhere are relative to this file too.

# The key that opens sealed values: an age identity, the AGE-SECRET-KEY-1
# line age-keygen writes, named as an env, credential, or file reference,
# never sealed itself. A systemd unit loads it as a credential, named here
# as { credential = "airut-age-key" }.
# Without this table a sealed value anywhere in the file is a problem.
#
# Seal a value with the airut command, which needs only the recipient
# (the age1... public key), and reads the value from stdin:
#
#   airut seal --recipient age1... --at providers.proxy.api_key < key.txt
#
# It prints the field to write there as api_key = { sealed = "..." }. The
# value opens only at the key path it was sealed for, so a sealed value
# moved to another key is refused rather than sent somewhere else. Keys
# under [app] are sealed by their own path, such as app.booru.token. A
# key path joins keys with dots, as problems name them: a key that is not
# only A-Z, a-z, 0-9, _ and - is quoted as a TOML string, as in
# app.tokens."a.b", and an array index is bracketed, as in
# app.mirrors[0].key, so no two places share a path.
#
# [secrets]
# key = { env = "AIRUT_AGE_KEY" }

[bot]
# Starts a text command, as in "!roll 2d6". Defaults to "!".
prefix = "!"
# How many messages up a reply chain the bot reads for a message
# addressed to it, 0 for none. Defaults to 3; at most 10.
reply_depth = 3
# The bot's owners, by platform: Matrix user ids and Discord user ids
# (snowflakes). airut.Owner admits them, and a bot gives it to whatever
# only owners may do, such as changing settings or the bot's profile.
# The built-in status command tells anyone whether the bot has an owner,
# and shows an owner the list. A bot with no owner on any platform it
# serves warns at every start, and answers a direct message with how to
# claim it. An owner can also be claimed on the host, without editing
# this file, with `airut claim -config FILE @you:example.org`, or the
# sample bot's own `airut-example claim @you:example.org`. Claims are kept
# in [store], and the running bot honours one within a minute. No chat
# command adds or removes an owner.
owners = { matrix = ["@owner:example.org"], discord = ["123456789012345678"] }

# Model providers: OpenAI-compatible endpoints. The table key is the
# provider's id, and a model is named as "id/model".
[providers.local]
base_url = "http://127.0.0.1:8080/v1"
# What else the server answers: "openai" (the default) for none, or
# "llama-swap", which loads one model at a time and lists the loaded
# ones at /running beside base_url. A chain skips a llama-swap model
# that is not loaded, unless load says to use it anyway: "never" (the
# default), "when_idle" (only when no model is loaded, so loading it
# evicts nothing), or "always" (evicting whatever is loaded). load
# applies only to llama-swap.
kind = "llama-swap"
load = "when_idle"
# A keyless local server leaves out api_key.
models = [
  # id is what the rest of this file names. model is the id sent to the
  # server, and defaults to id.
  #
  # context_window and max_output are in tokens; 0 or absent leaves
  # them unknown. context_window is what one request gets, so on a
  # llama.cpp server with parallel slots it is one slot's share.
  # Set max_output on a model an agent uses: without it no limit is
  # sent, and the server's own default, 1024 on llama.cpp, cuts
  # answers short.
  # reasoning marks a model that thinks before answering.
  # image_input = false marks a model, or a gateway in front of it, that
  # does not accept images: an agent turn on it sends a note in place of
  # each image rather than a request the server would refuse. Absent,
  # the model is taken to accept them.
  #
  # The rest set how a call is made, for every use site that names the
  # model, and a use site may override each one. output is how a reply
  # is held to a JSON shape: "response_format" (OpenAI's and
  # llama-server's), "json_schema" or "grammar" (llama.cpp's own
  # fields), or "none". timeout bounds a call. slots and cache_prompt
  # are llama.cpp's: pin each room to one of this many slots, and ask the
  # server to keep the prompt cached, so a room's next call reuses it.
  # temperature is 0 to 2. Absent, each is left to the use site.
  { id = "qwen3-32b", model = "Qwen3-32B-Q4_K_M", context_window = 32768, max_output = 8192, reasoning = true, image_input = false },
  # base makes a variant: the entry takes every key it leaves out,
  # model included, from another entry of the same provider. Use sites
  # name the variant, and the server sees the one model both serve.
  { id = "qwen3-judge", base = "qwen3-32b", context_window = 8192, reasoning = false, output = "json_schema", slots = 2, cache_prompt = true, temperature = 0 },
]

[providers.proxy]
base_url = "https://llm.example.net/v1"
api_key = { credential = "proxy-api-key" }
models = [{ id = "gpt-5.5", context_window = 128000, output = "response_format" }]

# Agent turns. Without this table the bot runs plain commands only.
[agent]
# The model a turn uses when it names none, as "provider/model". Set
# either model or models, a chain tried in order: a turn starts on the
# first entry that is available. An entry is "provider/model" or a
# table naming one as model, with any of the model's keys to override
# them here, such as { model = "proxy/gpt-5.5", timeout = "2m" }.
model = "local/qwen3-32b"
# models = ["local/qwen3-32b", "proxy/gpt-5.5"]
# Required. Caps a turn that sets no budget of its own.
budget = { max_turns = 8, max_tokens = 200000 }
# Optional. How much of a remembered conversation a turn resumes, for a
# turn that sets no bound of its own. Without it nothing is bounded but
# the model's window. max_messages and max_tokens count the messages and
# the estimated tokens a turn resumes, and compaction says what happens
# to the rest: "summarize" (the default) keeps a summary the model
# writes, "drop" forgets it. Messages older than max_age are left out
# either way. room_messages is how many of the channel's latest messages
# a turn sees as quoted chat beside the conversation, 0 (the default) to
# 50; each costs a read of the channel for every turn. follow_within is
# how soon a person must speak again for a Conversation turn to go on
# with their last conversation rather than start a new one; it defaults
# to 15m.
history = { max_messages = 200, max_tokens = 60000, max_age = "168h", compaction = "summarize", room_messages = 10, follow_within = "15m" }

# Optional. Turns per user and per channel in a sliding window; these
# are the defaults.
[agent.rate]
per_user = 5
per_channel = 20
window = "10m"
# With wait = true, a turn these caps refuse waits for its slot instead
# of failing: the bot reacts with an hourglass on the message, or replies
# once with the wait when it cannot react, and starts the turn when the
# slot frees. Each person has at most one turn waiting, for at most one
# window. A turn the access list refuses, and one a chime starts, never
# waits.
wait = false

# Optional. The owners' own caps, which [bot] owners and claimed owners
# take in place of per_user and per_channel above, in the same window.
# Their turns still count in the shared counts, so members are refused
# once the room is full. 0 means no cap, and a key left out takes the
# members' value; here per_channel stays 20. owners is the only group
# with a rate of its own: any other key under for is a problem.
[agent.rate.for.owners]
per_user = 30
# per_channel = 0

# Optional. The judge: one call with no tools for each judgement a bot
# asks for, such as whether to speak up in a conversation, on a model of
# its own. Without this table every judgement abstains.
[agent.judge]
# The judge's model, or its chain, as [agent] names them. A judgement
# tries each entry in turn, and each call takes its own entry's output,
# slots, cache_prompt, timeout, and max_input_tokens.
models = ["local/qwen3-judge", { model = "proxy/gpt-5.5", timeout = "40s", max_input_tokens = 16000 }]
# Judge calls in flight across the bot; more wait, and a room's waiting
# call is replaced by its newer one. Set it to the server's parallel
# slots. Defaults to 1.
concurrency = 2
# output, slots, cache_prompt, and timeout set here override them for
# every entry, beneath an entry's own. timeout bounds a call, waiting
# included, and defaults to 30s; output defaults to "response_format".
timeout = "20s"
# output = "json_schema"
# slots = 2
# cache_prompt = true
#
# Caps each call's whole request, instructions, chat, and reserved reply
# together, so it fits the server's per-slot context. With no tokenizer,
# the judge counts one token per bytes_per_token bytes, 3 by default,
# which overestimates English. Over the cap it drops the oldest context
# first. Without it each entry is capped at its model's context_window,
# or not at all when that is unknown. 0 caps nothing.
max_input_tokens = 8000
# bytes_per_token = 3
# Judgements per channel in a sliding window, apart from the turn rate,
# which a judgement never uses. Without it nothing caps them.
rate = { per_channel = 60, window = "1h" }

# Optional. Long-term memory, which the built-in remember, memories, and
# unremember commands and the remember tool write.
[agent.memory]
# What happens when the model asks to remember something, per scope:
# "off", "ask" (the person it is talking to is asked first), or "auto".
# A memory about someone else always waits for that person's consent,
# and one for the whole bot for an approver's. Defaults: ask, auto, off.
model_writes = { user = "ask", channel = "auto", bot = "off" }
# Active memories kept per person, per channel, and for the bot; past
# these the least recently used is archived, and recalled when a request
# mentions it. Defaults: 20, 50, 50.
max_user = 20
max_channel = 50
max_bot = 50

# Who may start an agent turn, per platform. A platform with no list, or
# an empty one, allows nobody.
[agent.access.discord]
users = ["123456789012345678"]
roles = ["234567890123456789"]

[agent.access.matrix]
# Matrix has no roles. The members of each room in rooms may start a
# turn too, as the room's member list says when they ask. Name a room by
# its id, never an alias, which can be pointed at another room.
users = ["@owner:example.org"]
rooms = ["!members:example.org"]

# Where agent sessions persist, and owners claimed with airut claim.
# Required with [agent]. A bot without one takes its owners from
# [bot] owners only.
[store]
path = "/var/lib/airut-example/sessions.db"
# Sessions idle longer than this are deleted. Defaults to 720h, 30 days.
retention = "720h"

# Each platform the bot serves has a table; leave out the others.
[discord]
token = { credential = "discord-token" }
# Register commands in these guilds; empty or absent registers globally.
guilds = ["345678901234567890"]

[matrix]
homeserver = "https://matrix.example.org"
user_id = "@sample:example.org"
# Logs in when no session is stored yet; optional once one is.
password = { credential = "matrix-password" }
# Keeps the Matrix session and the crypto store. Back it up.
state_dir = "/var/lib/airut-example/matrix"
device_name = "airut sample"
# Optional, and best left out. The account's cross-signing recovery key,
# which the cross-signing setup prints once. With it the bot signs its
# own device at start when the device is not signed, as after the state
# directory was re-created, so clients show its messages as verified.
# Without it, -cross-sign does the same and asks for the key, so the key
# never rests on the host. Guard it like the password: it can sign any
# device as the bot's.
# recovery_key = { credential = "matrix-recovery-key" }
# Optional, and off by default. Lets an owner verify the running bot
# from Element: the bot posts the emoji in the owner's encrypted direct
# chat with it, and confirms when the owner replies yes there. This
# trusts the homeserver, which could forge the exchange and rewrite the
# chat to match, so turn it on only for a homeserver you run and trust,
# and otherwise verify with -verify on the host. Owners claimed after
# the bot starts can use it once the bot restarts.
# verify_in_chat = true

# Optional. Sibling bots: other airut bots of the same owner, which sign
# each other's cross-signing identities once each proves, with a fleet
# secret they share, that its master key is its own. Each bot needs its
# device cross-signed first. The proofs go to one coordination room,
# which the owner makes invite-only and encrypted and invites every
# sibling to; the bot will not post in a room that is not encrypted.
# [matrix.siblings]
# The siblings' user ids. Only these are signed. The bot's own id may be
# listed too, so every sibling can share one list.
# users = ["@sample:example.org", "@other:example.org"]
# The coordination room, by id, never an alias.
# room = "!siblings:example.org"
# The fleet secret: the same on every sibling, at least 32 random bytes,
# made by the owner, as with `openssl rand -base64 48`. Whoever holds it
# can vouch for any listed account.
# secret = { credential = "matrix-fleet-secret" }
# While the secret is replaced on each sibling in turn, the one being
# replaced. Proofs made with it are still accepted; none are made.
# previous_secret = { credential = "matrix-fleet-secret-previous" }

# Metrics. Without this table the bot keeps its metrics in memory only,
# for a command that reports them.
[metrics]
# Serves /metrics in the Prometheus text format. Bind it to an address
# only the scraper reaches: the metrics name commands and platforms,
# never message text, but nothing guards the endpoint.
listen = "127.0.0.1:9464"
# Logs a summary of the metrics that changed since the last one.
summary_every = "15m"

# Runtime settings: the config layer of the settings the bot declares in
# code. A value here replaces the setting's default, and an override set
# from chat with `set NAME VALUE` replaces this, until `unset NAME` drops
# it. The bot refuses to start on a name it does not declare, or on a
# value outside the setting's bounds. A value is a whole number, true or
# false, or a string, which is how a duration ("10m") or one of a fixed
# set of values is written. A nested table's keys join with dots, so
# [settings.roll] max_dice = 10 names the same setting. Secrets never go
# here, because a setting's value is shown in chat.
#
# The Gate's limits are settings too, named agent.per_user,
# agent.per_channel, agent.window, agent.max_turns, and agent.max_tokens,
# with agent.for.owners.per_user and agent.for.owners.per_channel when
# [agent.rate.for.owners] is set. They are set by [agent] rate and
# budget, never here, and those values cap them: from chat they can be
# tightened, not loosened.
#
# Who may change a setting is the bot's to say. The sample bot lets the
# owners [bot] owners names, with Settings.Owner set to airut.Owner.
[settings]
roll.max_dice = 10
